<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Immigration Notice Explainer</title>
</head>
<body>
    <h1>Immigration Notice Explainer</h1>
    
    <form id="explainForm">
        <div>
            <label for="noticeText">Paste your immigration notice:</label>
            <textarea id="noticeText" rows="10" cols="80" placeholder="Paste the text of your immigration notice here..."></textarea>
        </div>
        
        <button type="submit">Explain Notice</button>
    </form>
    
    <div id="result" style="display: none;">
        <h2>Explanation:</h2>
        <div id="explanation"></div>
    </div>

    <script>
        document.getElementById('explainForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const noticeText = document.getElementById('noticeText').value;
            if (!noticeText.trim()) {
                alert('Please enter some text');
                return;
            }
            
            try {
                const response = await fetch('/explain', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ notice_text: noticeText })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('explanation').innerHTML = data.explanation;
                    document.getElementById('result').style.display = 'block';
                } else {
                    alert('Error: ' + (data.detail || 'Unknown error'));
                }
            } catch (error) {
                alert('Error connecting to server: ' + error.message);
            }
        });
    </script>
</body>
</html>
